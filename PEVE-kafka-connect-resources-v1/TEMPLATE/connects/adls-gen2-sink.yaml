# Guía: ../docs/adls-gen2-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-azure-datalakeGen2-storage-sink.html
name: "tpl-adls-gen2-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-adls-gen2-sink"
  connector.class: "AzureDataLakeGen2Sink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  output.data.format: "AVRO"
  azure.datalake.gen2.account.name: "stappadlsdes"
  topics.dir: "topics"
  partitioner.class: "TimeBasedPartitioner"
  time.interval: "HOURLY"
  flush.size: "1000"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_ADLS_01"
  secrets:
    azure.datalake.gen2.access.key:
      path: "peve/data/dev/peve/azure/ST_APP_ADLS_DES"
      field: "access_key"
