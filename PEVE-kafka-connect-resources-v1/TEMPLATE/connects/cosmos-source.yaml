# Guía: ../docs/cosmos-source.md
# https://docs.confluent.io/cloud/current/connectors/cc-azure-cosmos-source-v2.html
name: "tpl-cosmos-source"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-cosmos-source"
  connector.class: "CosmosDbSourceV2"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  output.data.format: "AVRO"
  azure.cosmos.account.endpoint: "https://cosmos-app-des.documents.azure.com:443/"
  azure.cosmos.source.database.name: "appdb"
  azure.cosmos.source.containers.includeAll: "false"
  azure.cosmos.source.containers.includedList: "demo-container"
  azure.cosmos.source.containers.topicMap: "azc-app-demo-input#demo-container"
  azure.cosmos.mode.gateway: "true"
  azure.cosmos.preferredRegionList: "East US"
  tasks.max: "1"

vault:
  service_account: "SA_AZC_DES_APP_COSSRC_01"
  secrets:
    azure.cosmos.account.key:
      path: "peve/data/dev/peve/cosmos/COSMOS_APP_DES"
      field: "account_key"
