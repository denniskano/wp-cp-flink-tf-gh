# Guía: ../docs/snowflake-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-snowflake-sink.html
name: "tpl-snowflake-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-snowflake-sink"
  connector.class: "SnowflakeSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  snowflake.url.name: "https://xy12345.east-us-2.azure.snowflakecomputing.com:443"
  snowflake.database.name: "APP_DB"
  snowflake.schema.name: "APP_SCHEMA"
  snowflake.role.name: "APP_KAFKA_ROLE"
  snowflake.ingestion.method: "SNOWPIPE_STREAMING"
  buffer.count.records: "10000"
  buffer.flush.time: "120"
  buffer.size.bytes: "10000000"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_SNOW_01"
  secrets:
    snowflake.user.name:
      path: "peve/data/dev/peve/snowflake/SF_APP_DES"
      field: "username"
    snowflake.private.key:
      path: "peve/data/dev/peve/snowflake/SF_APP_DES"
      field: "private_key"
