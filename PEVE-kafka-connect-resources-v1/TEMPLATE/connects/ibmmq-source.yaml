# Guía: ../docs/ibmmq-source.md
# https://docs.confluent.io/cloud/current/connectors/cc-ibmmq-source.html
name: "tpl-ibmmq-source"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-ibmmq-source"
  connector.class: "IbmMQSource"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  kafka.topic: "azc-app-demo-input"
  output.data.format: "AVRO"
  mq.hostname: "mq-app.example.internal"
  mq.port: "1414"
  mq.queue.manager: "QM1"
  mq.channel: "DEV.APP.SVRCONN"
  jms.destination.name: "APP.SOURCE.QUEUE"
  jms.destination.type: "queue"
  tasks.max: "1"

vault:
  service_account: "SA_AZC_DES_APP_MQSRC_01"
  secrets:
    mq.username:
      path: "peve/data/dev/peve/mq/MQ_APP_DES"
      field: "username"
    mq.password:
      path: "peve/data/dev/peve/mq/MQ_APP_DES"
      field: "password"
