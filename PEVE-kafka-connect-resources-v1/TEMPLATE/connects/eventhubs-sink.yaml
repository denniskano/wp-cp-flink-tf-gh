# Guía: ../docs/eventhubs-sink.md
# No existe AzureEventHubsSink en Confluent Cloud. Sink oficial: HttpSinkV2 → REST de Event Hubs.
# https://docs.confluent.io/cloud/current/connectors/cc-http-sink-v2.html
# https://learn.microsoft.com/en-us/rest/api/eventhub/send-event
name: "tpl-eventhubs-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-eventhubs-sink"
  connector.class: "HttpSinkV2"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  http.api.base.url: "https://ehns-app-des.servicebus.windows.net"
  https.ssl.enabled: "true"
  https.host.verifier.enabled: "true"
  auth.type: "OAUTH2"
  oauth2.token.url: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/oauth2/v2.0/token"
  oauth2.client.scope: "https://eventhubs.azure.net/.default"
  oauth2.client.auth.mode: "header"
  apis.num: "1"
  api1.http.api.path: "/hub-app-events/messages"
  api1.http.request.method: "POST"
  api1.request.body.format: "JSON"
  api1.http.request.headers: "Content-Type:application/json"
  api1.max.batch.size: "1"
  api1.max.retries: "5"
  api1.retry.backoff.policy: "EXPONENTIAL_WITH_JITTER"
  api1.retry.backoff.ms: "3000"
  api1.retry.on.status.codes: "400-"
  api1.http.connect.timeout.ms: "30000"
  api1.http.request.timeout.ms: "30000"
  api1.behavior.on.null.values: "IGNORE"
  behavior.on.error: "FAIL"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_EHSNK_01"
  secrets:
    oauth2.client.id:
      path: "peve/data/dev/peve/eventhubs/EH_APP_DES"
      field: "client_id"
    oauth2.client.secret:
      path: "peve/data/dev/peve/eventhubs/EH_APP_DES"
      field: "client_secret"
