# Guía: ../docs/servicebus-source.md
# https://docs.confluent.io/cloud/current/connectors/cc-azure-service-bus-source.html
name: "tpl-servicebus-source"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-servicebus-source"
  connector.class: "AzureServiceBusSource"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  kafka.topic: "azc-app-demo-input"
  output.data.format: "AVRO"
  azure.servicebus.namespace: "sbns-app-des"
  azure.servicebus.entity.name: "app-events"
  tasks.max: "1"

vault:
  service_account: "SA_AZC_DES_APP_SBSRC_01"
  secrets:
    azure.servicebus.sas.keyname:
      path: "peve/data/dev/peve/servicebus/SB_APP_DES"
      field: "key_name"
    azure.servicebus.sas.key:
      path: "peve/data/dev/peve/servicebus/SB_APP_DES"
      field: "key"
