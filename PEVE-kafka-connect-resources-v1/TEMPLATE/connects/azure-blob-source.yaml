# Guía: ../docs/azure-blob-source.md
# https://docs.confluent.io/cloud/current/connectors/cc-azure-blob-source.html
name: "tpl-azure-blob-source"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-azure-blob-source"
  connector.class: "AzureBlobSource"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topic.regex.list: "azc-app-demo-input:.*"
  input.data.format: "JSON"
  azblob.account.name: "stappconnectdes"
  azblob.container.name: "app-connect-src"
  tasks.max: "1"

vault:
  service_account: "SA_AZC_DES_APP_BLOSRC_01"
  secrets:
    azblob.account.key:
      path: "peve/data/dev/peve/azure/ST_APP_CONNECT_DES"
      field: "access_key"
