# Guía: ../docs/azure-blob-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-azure-blob-sink/cc-azure-blob-sink.html
name: "tpl-azure-blob-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-azure-blob-sink"
  connector.class: "AzureBlobSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  output.data.format: "JSON"
  azblob.account.name: "stappconnectdes"
  azblob.container.name: "app-connect-sink"
  time.interval: "HOURLY"
  flush.size: "1000"
  topics.dir: "topics"
  path.format: "'year'=YYYY/'month'=MM/'day'=dd/'hour'=HH"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_BLOB_01"
  secrets:
    azblob.account.key:
      path: "peve/data/dev/peve/azure/ST_APP_CONNECT_DES"
      field: "access_key"
