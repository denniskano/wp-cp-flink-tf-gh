# Guía: ../docs/sqlserver-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-microsoft-sql-server-sink.html
name: "tpl-sqlserver-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-sqlserver-sink"
  connector.class: "MicrosoftSqlServerSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  connection.host: "sql-app.database.windows.net"
  connection.port: "1433"
  db.name: "appdb"
  ssl.mode: "require"
  insert.mode: "INSERT"
  table.types: "TABLE"
  auto.create: "false"
  auto.evolve: "false"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_SQLSNK_01"
  secrets:
    connection.user:
      path: "peve/data/dev/peve/sqlserver/DB_APP_CONNECT_DEV"
      field: "username"
    connection.password:
      path: "peve/data/dev/peve/sqlserver/DB_APP_CONNECT_DEV"
      field: "password"
