# Guía: ../docs/ibmmq-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-ibm-mq-sink.html
name: "tpl-ibmmq-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-ibmmq-sink"
  connector.class: "IbmMQSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  mq.hostname: "mq-app.example.internal"
  mq.port: "1414"
  mq.queue.manager: "QM1"
  mq.channel: "DEV.APP.SVRCONN"
  jms.destination.name: "APP.SINK.QUEUE"
  jms.destination.type: "queue"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_MQSNK_01"
  secrets:
    mq.username:
      path: "peve/data/dev/peve/mq/MQ_APP_DES"
      field: "username"
    mq.password:
      path: "peve/data/dev/peve/mq/MQ_APP_DES"
      field: "password"
