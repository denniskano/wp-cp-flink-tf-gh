# Guía: ../docs/mysql-sink.md
# https://docs.confluent.io/cloud/current/connectors/cc-mysql-sink.html
name: "tpl-mysql-sink"
status: "RUNNING"

config_nonsensitive:
  name: "tpl-mysql-sink"
  connector.class: "MySqlSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  schema.context.name: "default"
  topics: "azc-app-demo-input"
  input.data.format: "AVRO"
  connection.host: "mysql-app.mysql.database.azure.com"
  connection.port: "3306"
  db.name: "appdb"
  ssl.mode: "require"
  insert.mode: "INSERT"
  auto.create: "false"
  tasks.max: "1"
  errors.tolerance: "all"

vault:
  service_account: "SA_AZC_DES_APP_MYSQL_01"
  secrets:
    connection.user:
      path: "peve/data/dev/peve/mysql/DB_APP_CONNECT_DEV"
      field: "username"
    connection.password:
      path: "peve/data/dev/peve/mysql/DB_APP_CONNECT_DEV"
      field: "password"
