# v4. Carry-over desde v3 (la que esté Running).
# 1) Deja v3 corriendo (stopped: false). No pares v3 todavía.
# 2) Aplica este archivo. v4 queda PENDING (la consola del pool no la muestra).
# 3) Pon v3 stopped: true y apply. v4 arranca desde los offsets de v3.
# 4) Cuando v4 esté Running, v3 puede pasar a apply: ignore.
# No pongas OPTIONS('scan.startup.mode' = ...) en el SQL: pisa el carry-over.
statement-name: "insert-filtered-passthrough-v4"
flink-compute-pool: "CP_AZC_${environment}_PEVE_02"
stopped: "false"

properties:
  sql.tables.initial-offset-from: "insert-filtered-passthrough-v3"

statement: |
  INSERT INTO `${catalog_name}`.`${cluster_name}`.`azc-peve-transaction-filtered` (
    `key`,
    transaction_id,
    card_id,
    user_id,
    purchase_id,
    store_id
  )
  SELECT
    `key`,
    transaction_id,
    card_id,
    CONCAT('v4:', user_id) AS user_id,
    purchase_id,
    store_id
  FROM `${catalog_name}`.`${cluster_name}`.`azc-peve-transaction`
  WHERE store_id >= 0
    AND user_id IS NOT NULL;
