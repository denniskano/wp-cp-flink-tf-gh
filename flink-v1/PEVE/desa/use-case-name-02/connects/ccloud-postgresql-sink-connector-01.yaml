# =============================================================================
# PostgreSQL Sink (JDBC) — DES
# connector.class: PostgresSink. connection.host sin jdbc://.
# db.name debe ser una database existente (Azure no crea una DB con el nombre
# del server). auto.create solo crea tablas, no la database.
# Egress Private Link (Flexible Server): sub-recurso postgresqlServer, antes del apply.
# =============================================================================
name: "peve-postgresql-sink-connector-01"
status: "RUNNING"

config_nonsensitive:
  name: "peve-postgresql-sink-connector-01"
  connector.class: "PostgresSink"
  kafka.auth.mode: "SERVICE_ACCOUNT"
  input.data.format: "AVRO"
  insert.mode: "INSERT"
  auto.create: "true"
  auto.evolve: "true"
  db.timezone: "UTC"
  ssl.mode: "require"
  tasks.max: "1"
  errors.tolerance: "all"
  topics: "azc-peve-transaction"
  connection.host: "peved02server.postgres.database.azure.com"
  connection.port: "5432"
  db.name: "postgres"

# Pruebas: user/password en claro. No usar en cert/prod; Terraform lo manda como config_sensitive.
config_sensitive:
  connection.user: "USREJDBCONNECTDES"
  connection.password: "CHANGE_ME"

vault:
  service_account: "SA_AZC_DES_PEVE_PGSNK_01"
