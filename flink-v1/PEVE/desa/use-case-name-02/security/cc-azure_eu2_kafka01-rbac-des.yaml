# RBAC del Service Account de Kafka Connect (mismo principal que vault.service_account).
# Recursos: topic, subject, transactional-id.
cluster:
  cc:
    properties:
      - name: "azure_eu2_kafka01"
    rbac:
    - principal: SA_AZC_DES_PEVE_DATAGEN_01
      resources:
      - resource_type: subject
        resource_name: 'azc-peve-connect-postgres-value'
        pattern_type: LITERAL
        role:
        - operation: DeveloperWrite
      - resource_type: topic
        resource_name: 'azc-peve-connect-postgres'
        pattern_type: LITERAL
        role:
        - operation: DeveloperWrite
    - principal: SA_AZC_DES_PEVE_PGSNK_01
      resources:
      - resource_type: subject
        resource_name: 'azc-peve-connect-postgres-value'
        pattern_type: LITERAL
        role:
        - operation: DeveloperRead
      - resource_type: topic
        resource_name: 'azc-peve-connect-postgres'
        pattern_type: LITERAL
        role:
        - operation: DeveloperRead
      - resource_type: topic
        resource_name: 'azc-peve-connect-postgres-dlq'
        pattern_type: LITERAL
        role:
        - operation: DeveloperWrite
        - operation: DeveloperRead
