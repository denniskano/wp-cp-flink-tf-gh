          secretId: ${{ secrets.APP_ROLESECRET_PEVE_DESA }}
          secrets: |
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_ARM_ACCESS_KEY secret | PEVE_GHA_ARM_ACCESS_KEY ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CFK_MDS_ACCESS_KEY secret | PEVE_GHA_CFK_MDS_ACCESS_KEY ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CC_CLUSTER_KEY_SECRETS * ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CC_SR_KEY_SECRETS * ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CC_GLOBAL_KEY_SECRETS * ;

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clone PEVE-event-driven-resources-v2 repository
        uses: actions/checkout@v4

      - name: Clone automation repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_AUTOMATION }}
          path: automation
 
      - name: Install CA Root Certificate
        env:
          PATH_CAROOT: ${{ env.PATH_CAROOT }}
        run: |
          mkdir -p /tmp/certs
          echo "${{ secrets.CA_CERT }}" > "${{ env.PATH_CAROOT }}"

      - name: Instalar yq
        uses: ./.github/actions/install-yq

      - name: export path yq
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          yq --version

      - name: terraform plan - CC RBAC
        uses: ./.github/actions/eda-resources
        with: 
          HV_PEVE_SECRETS: ${{ toJson(steps.get-secrets-hv.outputs) }}
          PATH_CAROOT: ${{ env.PATH_CAROOT }}
          CODAPP: ${{ env.CODAPP }}
          TF_RELATIVE_SUBPATH: ${{ env.TF_RELATIVE_SUBPATH }}
          RELATIVE_SUBPATH_SRC: ${{ env.RELATIVE_SUBPATH_SRC }}
          ENV: ${{ vars.ENV }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          CC_PROPERTIES: ${{ vars.CC_PROPERTIES }}
          CC_SR_PROPERTIES: ${{ vars.CC_SR_PROPERTIES }}
          CLUSTER_TYPE: "cc"
          JOB_STAGE : "CI"
          SPECIFIC_RESOURCES: "RBAC"

  CD_cc_rbac:
    name: "CD Job CC RBAC ${{ github.event.inputs.CODAPP }}"
    needs: CI_cc_rbac
    runs-on: "arc-runner-desa-set" #self-hosted
    environment: APP_PEVE_CD_DESA

    steps:

      - name: Install basic tools
        run: |
          sudo apt-get update  > /dev/null 2>&1; sudo apt-get install jq unzip git wget tree ca-certificates gettext -y  > /dev/null 2>&1

      - name: Install NodeJs
        uses: actions/setup-node@v2
        with:
          node-version: 16.13.1

      - name: Get Secrets HV
        id: get-secrets-hv
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.HV_ADDRESS }}
          tlsSkipVerify: true
          method: approle
          roleId: ${{ secrets.APP_ROLEID_PEVE_DESA }}
          secretId: ${{ secrets.APP_ROLESECRET_PEVE_DESA }}
          secrets: |
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_ARM_ACCESS_KEY secret | PEVE_GHA_ARM_ACCESS_KEY ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CFK_MDS_ACCESS_KEY secret | PEVE_GHA_CFK_MDS_ACCESS_KEY ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CC_CLUSTER_KEY_SECRETS * ;
            peve/kv2/data/dev/peve/ccloud/PEVE_GHA_CC_SR_KEY_SECRETS * ;
