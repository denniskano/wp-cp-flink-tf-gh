name: peve-util-hashicorp-vault
on:
  workflow_dispatch:
    inputs:
      hv_secret_path:
        description: "Selecciona el path de hv"
        required: true
        default: "peve"
        type: choice
        options:
          - peve
          - peve/ccloud
          - peve/internal-certificates
      hv_secret_name:
        description: 'Nombre del secreto'
        required: true
        default: ''
env:
  TERRAFORM_VERSION: "1.11.1"
  HV_ADDRESS: "https://vaultdev.lima.bcp.com.pe:443"
  HV_MOUNT: "peve/kv2"
  HV_ROOT_PATH: "dev/"
#  TF_LOG: "DEBUG"

jobs:
  CI_HV:
    name: "CI - HV (DESA)"
    runs-on: "arc-runner-desa-set" #self-hosted
    environment: PEVE_DESA_UTIL

    steps:

      - name: Install basic tools
        run: |
          if [[ "${{ vars.BRANCH_TARGET }}" != ${{ github.ref_name }} ]]; then
            echo "Este job solo esta permitido para ${{ vars.BRANCH_TARGET }}"
            exit 1
          fi
          sudo apt-get update  > /dev/null 2>&1; sudo apt-get install jq unzip git tree ca-certificates -y  > /dev/null 2>&1

      - name: Install NodeJs
        uses: actions/setup-node@v2
        with:
          node-version: 16.13.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clone PEVE-event-driven-resources-v2 repository
        uses: actions/checkout@v4

      - name: terraform plan - HV
        env:
          TF_VAR_vault_address: ${{ env.HV_ADDRESS }}
          TF_VAR_login_approle_role_id: ${{ secrets.APP_ROLEID_PEVE_DESA }}
          TF_VAR_login_approle_secret_id:  ${{ secrets.APP_ROLESECRET_PEVE_DESA }}
          TF_VAR_hv_secret_mount:  ${{ env.HV_MOUNT }}
          TF_VAR_hv_secret_path: "${{ env.HV_ROOT_PATH}}${{ github.event.inputs.hv_secret_path }}/${{ github.event.inputs.hv_secret_name }}"
          TF_VAR_hv_secret_name: ${{ github.event.inputs.hv_secret_name }}
          TF_VAR_hv_secret_value: ${{ secrets.DINAMIC_SAVE_SECRET }}
          TF_VAR_hv_certificate_pfx_base64: ${{ secrets.PFX_BASE64 }}
        run: |
          tree
          secret_type="secret"
          if [ "${{ github.event.inputs.hv_secret_path }}" = "peve/internal-certificates" ]; then
            secret_type="certificate_v1"
          fi
          export TF_VAR_hv_secret_type=$secret_type
          ls -lia ./PEVE/hashicorp-vault
          terraform -chdir=./PEVE/hashicorp-vault init
          terraform -chdir=./PEVE/hashicorp-vault validate
          terraform -chdir=./PEVE/hashicorp-vault plan

  CD_HV:
    name: "CD - HV (DESA)"
    needs: CI_HV
    runs-on: "arc-runner-desa-set" #self-hosted
    environment: PEVE_DESA_UTIL

    steps:

      - name: Install basic tools
        run: |
          sudo apt-get update  > /dev/null 2>&1; sudo apt-get install jq unzip git tree ca-certificates -y  > /dev/null 2>&1

      - name: Install NodeJs
        uses: actions/setup-node@v2
        with:
          node-version: 16.13.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clone PEVE-event-driven-resources-v2 repository
        uses: actions/checkout@v4

      - name: terraform apply - HV
        env:
          TF_VAR_vault_address: ${{ env.HV_ADDRESS }}
          TF_VAR_login_approle_role_id: ${{ secrets.APP_ROLEID_PEVE_DESA }}
          TF_VAR_login_approle_secret_id:  ${{ secrets.APP_ROLESECRET_PEVE_DESA }}
          TF_VAR_hv_secret_mount:  ${{ env.HV_MOUNT }}
          TF_VAR_hv_secret_path: "${{ env.HV_ROOT_PATH}}${{ github.event.inputs.hv_secret_path }}/${{ github.event.inputs.hv_secret_name }}"
          TF_VAR_hv_secret_name: ${{ github.event.inputs.hv_secret_name }}
          TF_VAR_hv_secret_value: ${{ secrets.DINAMIC_SAVE_SECRET }}
          TF_VAR_hv_certificate_pfx_base64: ${{ secrets.PFX_BASE64 }}
        run: |
          tree
          secret_type="secret"
          if [ "${{ github.event.inputs.hv_secret_path }}" = "peve/internal-certificates" ]; then
            secret_type="certificate_v1"
          fi
          export TF_VAR_hv_secret_type=$secret_type
          ls -lia ./PEVE/hashicorp-vault
          terraform -chdir=./PEVE/hashicorp-vault init
          terraform -chdir=./PEVE/hashicorp-vault validate
          terraform -chdir=./PEVE/hashicorp-vault apply --auto-approve

