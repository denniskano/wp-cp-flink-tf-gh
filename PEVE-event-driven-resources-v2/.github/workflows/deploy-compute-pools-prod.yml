name: Deploy Flink Compute Pools

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
          - plan
      CODAPP:
        description: 'codigo de applicación de 4 letras'
        required: true
        type: string

env:
  VAULT_ADDR: "https://vault.lima.bcp.com.pe:443"
  CODAPP: ${{ github.event.inputs.CODAPP }}
  TF_VAR_compute_pool_config_path: "../../${{ github.event.inputs.CODAPP }}/ccloud-flink-compute-pool/prod-vars.yaml"
  STORAGE_CONTAINER_NAME: tf-flink-cps-prod
  RESOURCE_GROUP_NAME: RSGREU2PEVEP01
  RESOURCES_REPO: BCP-Integration-Automation/peve-ccloud-flink-template
  RESOURCES_BRANCH: master
  TERRAFORM_VERSION: "1.5.0"
  NODE_VERSION: "16.13.1"
  TERRAFORM_WORKDIR: terraform/ccloud-flink-compute-pool
  SERVICE_ACCOUNT: SA_AZC_PRO_PEVE_FLK_01
  API_KEY: AK_AZC_PRO_PEVE_CRMAN_COMPPOOL_01

jobs:
  deploy-compute-pools:
    runs-on: arc-runner-prod-set
    environment: APP_PEVE_CI_PROD
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESOURCES_BRANCH }}

      - name: Checkout ${{ env.CODAPP }} resources
        uses: actions/checkout@v4
        with:
          ref: automation-v3-flink
          path: resources
      
      - name: Move terraform to correct location
        run: |
          mv resources/terraform ./terraform
          rm -rf resources
          echo "✅ terraform folder moved to workspace root"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install yq
        run: |
          echo "=== Installing yq ==="
          sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          echo "✅ yq installed successfully"
      
      - name: Install NodeJs
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get Secrets for Compute Pools
        id: get-secrets-cp
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          tlsSkipVerify: true
          method: approle
          # namespace: admin
          roleId: ${{ secrets.APP_ROLEID_PEVE_PROD }}
          secretId: ${{ secrets.APP_ROLESECRET_PEVE_PROD }}
          secrets: |
            cos/kv2/data/prod/peve/ccloud/${{ env.SERVICE_ACCOUNT }}/${{ env.API_KEY }} username | CONFLUENT_CLOUD_API_KEY ;
            cos/kv2/data/prod/peve/ccloud/${{ env.SERVICE_ACCOUNT }}/${{ env.API_KEY }} password | CONFLUENT_CLOUD_API_SECRET ;
            cos/kv2/data/prod/peve/ccloud/PEVE_GHA_ARM_ACCESS_KEY secret | PEVE_GHA_ARM_ACCESS_KEY ;

      - name: Configure Azure Storage Access Key
        run: |
          echo "Configuring Azure Storage Access Key"
          export ARM_ACCESS_KEY=${{ env.PEVE_GHA_ARM_ACCESS_KEY }}
          echo "✅ Azure Storage Access Key configured"

      - name: Terraform Init - Compute Pools
        working-directory: ${{ env.TERRAFORM_WORKDIR }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ vars.STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ env.STORAGE_CONTAINER_NAME }}" \
            -backend-config="key=prod/${{ env.CODAPP }}/tf-flink.tfstate" \
            -backend-config="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
            -backend-config="access_key=${{ env.PEVE_GHA_ARM_ACCESS_KEY }}"
        env:
          ARM_ACCESS_KEY: ${{ env.PEVE_GHA_ARM_ACCESS_KEY }}

      - name: Extract Environment ID from CC_PROPERTIES
        id: extract-env
        run: |
          echo "CC_PROPERTIES raw content:"
          echo '${{ vars.CC_PROPERTIES }}'
          
          # Extraer environment_id del JSON
          ENVIRONMENT_ID=$(echo '${{ vars.CC_PROPERTIES }}' | jq -r '.azure_eu2_kafka01.environment_id')
          
          echo "Extracted ENVIRONMENT_ID: '$ENVIRONMENT_ID'"
          
          if [ -z "$ENVIRONMENT_ID" ] || [ "$ENVIRONMENT_ID" == "null" ]; then
            echo "Error: Could not extract environment_id from CC_PROPERTIES"
            exit 1
          fi
          
          echo "ENVIRONMENT_ID=$ENVIRONMENT_ID" >> $GITHUB_ENV
          echo "✅ Environment ID configured: $ENVIRONMENT_ID"

      - name: Terraform Plan - Compute Pools
        working-directory: ${{ env.TERRAFORM_WORKDIR }}
        run: terraform plan
        if: github.event.inputs.action != 'destroy'
        env:
          TF_VAR_confluent_cloud_api_key: ${{ env.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ env.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_environment_id: ${{ env.ENVIRONMENT_ID }}

      - name: Terraform Apply - Compute Pools
        working-directory: ${{ env.TERRAFORM_WORKDIR }}
        run: terraform apply -auto-approve
        if: github.event.inputs.action == 'apply'
        env:
          TF_VAR_confluent_cloud_api_key: ${{ env.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ env.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_environment_id: ${{ env.ENVIRONMENT_ID }}

      - name: Terraform Destroy - Compute Pools
        working-directory: ${{ env.TERRAFORM_WORKDIR }}
        run: terraform destroy -auto-approve
        if: github.event.inputs.action == 'destroy'
        env:
          TF_VAR_confluent_cloud_api_key: ${{ env.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ env.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_environment_id: ${{ env.ENVIRONMENT_ID }}

      - name: Output Compute Pool IDs
        working-directory: ${{ env.TERRAFORM_WORKDIR }}
        run: |
          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            echo "=== Compute Pool IDs ==="
            terraform output -json compute_pool_ids
            echo "=== Compute Pool Configs ==="
            terraform output -json compute_pool_configs
          fi

