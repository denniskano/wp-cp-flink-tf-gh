      - name: "View Log Error Schema Registry EU2"
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
        continue-on-error: true
        run: |
          export KUBECONFIG=~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          kubectl config get-contexts
          kubectl -n eu2 get pods
          echo "View Log Error Schema Registry EU2"
          kubectl -n eu2 logs schemaregistry-0 |egrep -B 2 -i "io.confluent.license.LicenseStore licenseScan" || true

      - name: "View Log zookeer and Quorum "
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
        run: |
          export KUBECONFIG=~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          kubectl config get-contexts
          kubectl -n eu2 get pods
          echo "View leader zookeeper"
          kubectl -n eu2 logs zookeeper-0 |egrep -i "TOOK|Connected to leader"

      - name: "List topics CFK"
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
        run: |
          export KUBECONFIG=~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          kubectl config get-contexts
          kubectl -n poc get pods --no-headers |grep kafkaclient4
          kafkaclient4_pod=$(kubectl -n poc get po --no-headers |grep kafkaclient4 | awk 'NR==1{print $1}')
          echo "Nos conectamos al Pod: $kafkaclient4_pod"
          echo ""
          echo ""
          echo "Listar todos los topicos CFK"
