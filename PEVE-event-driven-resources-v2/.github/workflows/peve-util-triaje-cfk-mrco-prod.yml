  CFK_EU2:
    name: "Health check AKS CFK EU2"
    runs-on: arc-runner-prod-set
    environment: PEVE_UTIL_CD_PROD
    needs: PREPARE


    steps:
      - name: Cache de Binario kubectl
        id: cache-kubectl
        uses: actions/cache@v4
        with:
          path: ~/kubectl_bin
          key: kubectl_bin

      - name: Descargar kubectl sino existe en Cache
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        run: |
          curl -o ~/kubectl_bin -L "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"

      - name: Instalar kubectl
        run: |
          mkdir -p "$HOME/bin"
          ls -liah ~/kubectl_bin
          cp ~/kubectl_bin "$HOME/bin/kubectl"
          sudo chmod a+x "$HOME/bin/kubectl"
          echo "$HOME/bin" >> $GITHUB_PATH
          ls -liah "$HOME/bin/kubectl"

      - name: "get kubeconfig EU2"
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.TMP_PEVE_AKS_EU2_KUBECONFIG_PROD }}" > ~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          ls -lia  ~/.kube
          export KUBECONFIG=~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          kubectl version
          kubectl config get-contexts
          kubectl cluster-info

      - name: "Listar todos los nodos AKS EU2"
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
        continue-on-error: true
        run: |
          export KUBECONFIG=~/.kube/aks-${{ env.REGION }}-config-${{ env.ENV }}
          kubectl config get-contexts
          echo ""
          echo ""
          echo ""
          echo "Listar nodos AKS EU2"
          kubectl get nodes -L agentpool -L topology.kubernetes.io/zone

      - name: "Listar eventos de AKS EU2"
        shell: bash
        env:
          ENV: ${{ env.AMBIENTE }}
          REGION: "eu2"
