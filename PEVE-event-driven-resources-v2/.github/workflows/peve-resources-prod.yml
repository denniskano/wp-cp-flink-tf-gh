          PATH_CAROOT: ${{ env.PATH_CAROOT }}
          CODAPP: ${{ env.CODAPP }}
          TF_RELATIVE_SUBPATH: ${{ env.TF_RELATIVE_SUBPATH }}
          RELATIVE_SUBPATH_SRC: ${{ env.RELATIVE_SUBPATH_SRC }}
          ENV: ${{ vars.ENV }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          CC_SR_PROPERTIES: ${{ vars.CC_SR_PROPERTIES }}
          JOB_STAGE : "CD"
          cfk_sr_id: ${{ env.CFK_SR_ID }}
