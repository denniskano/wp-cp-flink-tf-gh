            cos/kv2/data/prod/peve/ccloud/PEVE_GHA_CC_CLUSTER_KEY_SECRETS * ;
            cos/kv2/data/prod/peve/ccloud/PEVE_GHA_CC_SR_KEY_SECRETS * ;

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clone PEVE-event-driven-resources-v2 repository
        uses: actions/checkout@v4

      - name: Clone automation repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_AUTOMATION }}
          path: automation
 
      - name: Install CA Root Certificate
