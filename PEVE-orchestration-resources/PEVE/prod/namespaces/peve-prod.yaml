# Prod exige 2 regiones y un par HA válido (eso es réplica Temporal, no PrivateLink).
# azure-centralus NO tiene réplica Azure–Azure; el par documentado es multi-cloud.
# Sin PE por ahora. Con PE: una rule por región, IDs reales de Governance.
name: peve-prod
regions:
  - azure-centralus
  - aws-us-east-1
retention_days: 30
api_key_auth: true
labels:
  codapp: peve
  env: prod
# connectivity:
#   - name: peve-prod-pl-centralus
#     type: private
#     region: azure-centralus
#     azure_pe_resource_id: "/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Network/privateEndpoints/<pe-azure>"
#   - name: peve-prod-pl-use1
#     type: private
#     region: aws-us-east-1
#     connection_id: "vpce-…"
service_accounts:
  - name: peve-prod-worker
    permission: write
    account_access: developer
    api_keys:
      - display_name: peve-prod-worker-key
        expiry_time: "2028-12-31T00:00:00Z"
