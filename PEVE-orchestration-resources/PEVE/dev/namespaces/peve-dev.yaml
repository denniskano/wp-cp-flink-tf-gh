# Namespace principal DES. Región: azure-centralus (sin HA Azure–Azure).
# Sin connectivity = sin Private Endpoint (público). Cuando Governance entregue el PE, pegá el bloque (mismo ARM en todos los YAML del env).
name: peve-dev
regions:
  - azure-centralus
retention_days: 14
api_key_auth: true
labels:
  codapp: peve
  env: dev
# connectivity:
#   - name: peve-dev-pl-centralus
#     type: private
#     region: azure-centralus
#     azure_pe_resource_id: "/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Network/privateEndpoints/<pe-del-entorno>"
search_attributes:
  - name: CustomerId
    type: keyword
  - name: OrderAmount
    type: double
service_accounts:
  - name: peve-dev-worker
    permission: write
    account_access: developer
    extra_namespaces:
      - name: peve-dev-pagos
        permission: read
    api_keys:
      - display_name: peve-dev-worker-key
        expiry_time: "2028-12-31T00:00:00Z"
users:
  - email: peve-temporal-dev@bcp.com.pe
    permission: write
