name: peve-cert
regions:
  - azure-centralus
retention_days: 14
api_key_auth: true
labels:
  codapp: peve
  env: cert
# Sin PE. Con Private Endpoint: descomentá connectivity (mismo ARM en todos los YAML de cert).
# connectivity:
#   - name: peve-cert-pl-centralus
#     type: private
#     region: azure-centralus
#     azure_pe_resource_id: "/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Network/privateEndpoints/<pe-del-entorno>"
service_accounts:
  - name: peve-cert-worker
    permission: write
    account_access: developer
    api_keys:
      - display_name: peve-cert-worker-key
        expiry_time: "2028-12-31T00:00:00Z"
