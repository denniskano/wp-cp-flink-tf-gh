statement-name: "statement-dml-insert-internal-from-input-compra"
flink-compute-pool: "CP_AZC_EU2_DES_PEVE_03"
service-account: "SA_AZC_DES_PEVE_PEVEMQFL_03"
api-key: "AK_AZC_DES_PEVE_FLINK_PEVEMQFL_01"
stopped: "false"
statement: |
  insert into `azc-peve-poc-flink-internal`(
    event_start,
    event_end,
    new_field1,
    new_field2,
    new_field3,
    new_field4
  )
  SELECT
    window_start,
    window_end,
    ( MAX(my_field1) + 1 ) AS my_field1,
    ( AVG(my_field2) + 100.0 ) AS my_field2,
    CONCAT('Interacción: ', CAST( MAX(my_field1) AS VARCHAR)) AS my_field3,
    CAST (COUNT(my_field1) AS INT) AS my_field4
  FROM TABLE (
  TUMBLE (
    TABLE `azc-peve-poc-input-compra`,
    DESCRIPTOR ($rowtime ),
    INTERVAL '1' SECONDS )
  )
  GROUP BY window_start, window_end;
