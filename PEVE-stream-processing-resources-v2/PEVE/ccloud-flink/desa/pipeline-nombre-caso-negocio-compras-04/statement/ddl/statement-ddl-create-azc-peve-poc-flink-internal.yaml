statement-name: "statement-ddl-create-azc-peve-poc-flink-internal"
flink-compute-pool: "CP_AZC_EU2_DES_PEVE_01"
service-account: "SA_AZC_DES_APPV_CDPEVEFL_01"
api-key: "AK_AZC_DES_APPV_FLINK_CDPEVEFL_01"

statement: |
  CREATE TABLE IF NOT EXISTS `azc-peve-poc-flink-internal`(
    event_start TIMESTAMP(3),
    event_end TIMESTAMP(3),
    new_field1 int,
    new_field2 double,
    new_field3 string,
    new_field4 bigint
  )
  DISTRIBUTED INTO 3 BUCKETS 
  WITH (
    'scan.startup.mode' = 'earliest-offset',
    'kafka.retention.time' = '2 d',
    'changelog.mode' = 'append'
  );
