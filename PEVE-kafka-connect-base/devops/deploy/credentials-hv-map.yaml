ocp:
  client: "oc"
  credentials:
    - id: acr-devops-${deploymentEnvironment}
      items:
      - key: username
        varkey: AZURE_REGISTRY_USERNAME
      - key: password
        varkey: AZURE_REGISTRY_PASSWORD
    - id: ocpa4_userapp_credentials_${deploymentEnvironment}
      items:
      - key: username
        varkey: EXTERNAL_REGISTRY_USERNAME
      - key: password
        varkey: EXTERNAL_REGISTRY_PASSWORD
    - id: atla-token-bitbucket-${deploymentEnvironment}
      items:
      - key: username
        varkey: GIT_USER
      - key: password
        varkey: GIT_PASSWORD
aks:
  client: "kubectl"
  credentials:
    - id: acr-devops-${deploymentEnvironment}
      items:
      - key: username
        varkey: EXTERNAL_REGISTRY_USERNAME
      - key: password
        varkey: EXTERNAL_REGISTRY_PASSWORD
    - id: ${project}_az_sp_${deploymentEnvironment}
      items:
      - key: secret
        varkey: AKS_SP
    - id: ${project}_az_tenant_${deploymentEnvironment}
      items:
      - key: secret
        varkey: AZ_TENANT
    - id: ${project}_az_certificate_${deploymentEnvironment}
      items:
      - key: fileValue
        varkey: AKS_CERTIFICATE
        type: FileBinding
    - id: atla-token-bitbucket-${deploymentEnvironment}
      items:
      - key: username
        varkey: GIT_USER
      - key: password
        varkey: GIT_PASSWORD
